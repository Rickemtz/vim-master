id: copiar-002
module: 6
title: "Copia una palabra y pégala después"
difficulty: 2
type: edit
instructions: |
  Usa `yiw` para copiar la palabra, `$` para ir al final de la línea, y
  `p` para pegarla después del cursor.
initial: |
  hola
cursor_start: [0, 0]
target: |
  holahola
target_cursor: null
time_limit_sec: 20
par_keystrokes: 5
solution: "yiw$p"
allowed: [y, i, w, p, "$"]
forbid_arrows: true
hints:
  - "p pega después del cursor, a diferencia de P"
