id: deshacer-008
module: 5
title: "Deshaz solo la repetición"
difficulty: 3
type: edit
instructions: |
  Borra "uno " con `dw`, repite con `.` para borrar "dos " también, y
  deshaz solo esa repetición con `u` (debe quedar solo el primer
  borrado).
initial: |
  uno dos tres
cursor_start: [0, 0]
target: |
  dos tres
target_cursor: null
time_limit_sec: 20
par_keystrokes: 4
solution: "dw.u"
allowed: [d, w, u]
forbid_arrows: true
hints:
  - "u deshace un cambio a la vez, incluyendo el que hizo el último ."
